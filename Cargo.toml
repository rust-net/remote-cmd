[package]
name = "remote-cmd"
version = "0.2.0"
edition = "2024"

[dependencies]
macro-log = "0.3.0"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros", "ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_html_form = "0.2"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
base64 = "0.22"
encoding_rs = "0.8"
tempfile = "3"
open = "5"
dirs = "5"
futures = "0.3"
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["rustls-tls-webpki-roots", "handshake"] }
thiserror = "2"
anyhow = "1"
portable-pty = "0.9"
crossterm = "0.29"
zip = { version = "2", default-features = false, features = ["deflate"] }
tower-http = { version = "0.6", features = ["trace"] }
xdialog = "4.1.4"

[target.'cfg(unix)'.dependencies]
# http：Unix socket/TCP 传输（默认 feature，禁用 default 时必须显式声明）；pipe：Windows 命名管道
bollard = { version = "0.21", default-features = false, features = ["http", "pipe"] }
# 文件推入容器：upload_to_container 需要 tar 归档流
tar = "0.4"
# 自更新解包 Linux 的 tar.gz 资产（默认 feature 为纯 Rust miniz_oxide）
flate2 = "1"
bytes = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Globalization", "Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
